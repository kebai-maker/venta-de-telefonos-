<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>venta-de-telefonos/mi-pagina-web-propia</title>
</head>

<body>
    <header>
        <p align="center"><strong>VENTA DE TELEFONOS</strong></p>
        <nav>
            <ul>
                <li><a href="index.html">inicio</a></li>
                <li><a href="#CATALOGO">catalogos</a></li>
                <li><a href="pedidos.html">pedido</a></li>
                <li><a href="#CONTACTO">contacto</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>haz tu pedido</h1>
        <p>brindanos tus datos</p>
        <form action="#">
            <fieldset>
                <legend>datos del cliente</legend>
                <label for="nombre">nombre</label>
                <input type="text" id="nombre" name="nombre" required>
                <label for="apellido">apellido</label>
                <input type="text" id="apellido" name="apellido" required>
                <label for="email">email</label>
                <input type="text" id="email" name="email" required>
                <label for="nrodecontacto">nro de contacto</label>
                <input type="telefono" id="nrodecontacto" name="nrodecontacto" required>
            </fieldset>
            <fieldset>
                <legend>tu pedido</legend>
                <label for="catalogos">catalogos</label>
                <select name="catalogos" id="catalogos" required>
                    <option value="">eligue un telefono</option>
                    <opntion>Redmagic 11s Pro</opntion>
                    <opntion>Redmagic 10 Pro</opntion>
                </select>
                <label for="cantidad">cantidad</label>
                <input type="number" id="cantidad" name="cantidad" min="1" value="1" required>
                <label for="fecha">fecha de recojo</label>
                <input type="date" id="fecha" name="fecha" required>
            </fieldset>
            <input type="checkbox" id="consentimineto" name="consentimineto" required>
            <label for="consentimineto">autorizo que usen mis datos solo para atender este perdido</label>
            <button type="submit">enviar pedido</button>
        </form>
    </main>
</body>
</html>
